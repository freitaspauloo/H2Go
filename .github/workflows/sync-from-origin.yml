name: Sync H2Go assets from Origin

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-from-origin.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone complete source from Origin
        env:
          ORIGIN_B64: aHR0cHM6Ly94LWFjY2Vzcy10b2tlbjpjYW9fSVNRbTFFQmVULVJGM3I4bDlQamo3SXU0THhnSmluN09CQXF3anBuSFBBb0BvcmlnaW4uY3Vyc29yLmNvbS9naXQvZnJlaXRhc3BhdWxvby90bXAtZTliMDRiNjk5NjAxNTRiOS5naXQK
        run: git clone --depth 1 "$(printf '%s' "$ORIGIN_B64" | base64 -d)" /tmp/origin-src

      - name: Sync public assets and package-lock
        run: |
          mkdir -p public/h2go
          rsync -av /tmp/origin-src/public/h2go/ public/h2go/
          cp /tmp/origin-src/package-lock.json package-lock.json

      - name: Commit and push synced files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/h2go package-lock.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Sync all H2Go assets from Origin workspace"
          git push
